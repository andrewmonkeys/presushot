<!DOCTYPE html>
<html>
<head>
    <title>Solicitud de presupuesto</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Solicitar presupuesto 📸</h1>

    <input id="nombre" placeholder="Tu nombre">

    <input type="date" id="fecha">

    <input id="lugar" placeholder="Lugar de la boda">

    <h3>Servicios</h3>

    <label><input type="checkbox" id="boda"> Fotografía de boda</label><br>
    <label><input type="checkbox" id="preboda"> Preboda</label><br>
    <label><input type="checkbox" id="postboda"> Postboda</label><br>
    <label><input type="checkbox" id="video"> Vídeo</label><br>
    <label><input type="checkbox" id="album"> Álbum impreso</label><br>

    <button onclick="enviarSolicitud()">
        Enviar solicitud
    </button>

</div>

<script src="reserva.js"></script>

</body>
</html>
